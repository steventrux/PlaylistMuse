services:
  playlistmuse-test:
    build:
      context: .
    container_name: playlistmuse-test
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5770"
    ports:
      - "0.0.0.0:5770:5770"
    environment:
      PLAYLISTMUSE_DATA_DIR: /app/data
      PLAYLISTMUSE_AI_PROVIDER: ${PLAYLISTMUSE_AI_PROVIDER:-}
      PLAYLISTMUSE_AI_API_KEY: ${PLAYLISTMUSE_AI_API_KEY:-}
      PLAYLISTMUSE_AI_MODEL: ${PLAYLISTMUSE_AI_MODEL:-}
      PLAYLISTMUSE_AI_BASE_URL: ${PLAYLISTMUSE_AI_BASE_URL:-}
    volumes:
      - playlistmuse-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5770/api/health', timeout=5).read()"
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  playlistmuse-data:
    external: true
