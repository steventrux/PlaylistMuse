<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070916">
  <link rel="icon" type="image/png" href="/static/playlistmuse-favicon.png?v=1">
  <title>Advanced statistics · PlaylistMuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=10">

<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI playlist studio</p>
      <h1>PlaylistMuse</h1>
    </div>
    <a class="secondary library-header-link" href="/" aria-label="Home" title="Home">Create playlist</a>
  </header>

  <main>
    <section class="card stats-card" aria-label="Advanced statistics">
      <a class="stats-back-link" href="/static/statistics.html">&larr; Back to Statistics</a>

      <p id="stats-status" class="status" aria-live="polite">Loading statistics&hellip;</p>

      <div id="stats-content" class="hidden">
        <div id="stats-provider-cards"></div>
        <p id="stats-provider-cards-empty" class="field-hint hidden">No generation data recorded yet.</p>
      </div>
    </section>
  </main>

  <script src="/static/common.js?v=8"></script>
  <script src="/static/statistics-render.js?v=2"></script>
  <script src="/static/statistics-advanced.js?v=1"></script>
  <script src="/static/home-status.js?v=26"></script>
