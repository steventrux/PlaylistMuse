<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070916">
  <title>My playlists · PlaylistMuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=10">
  <link rel="stylesheet" href="/static/layout.css?v=5">
  <link rel="stylesheet" href="/static/controls.css?v=7">
  <link rel="stylesheet" href="/static/library.css?v=4">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI playlist studio</p>
      <h1>PlaylistMuse</h1>
    </div>
    <a class="secondary library-header-link" href="/">Create playlist</a>
  </header>

  <main>
    <section class="card library-card" aria-labelledby="library-heading">
      <div class="library-heading-row">
        <div>
          <p class="eyebrow">Local library</p>
          <h2 id="library-heading">My playlists</h2>
          <p class="library-intro">Generated playlists are saved here and remain available after the container restarts.</p>
        </div>
        <label class="library-sort" for="library-sort">
          Sort by
          <select id="library-sort">
            <option value="updated_desc">Recently updated</option>
            <option value="created_desc">Recently created</option>
            <option value="title_asc">Title A–Z</option>
            <option value="title_desc">Title Z–A</option>
          </select>
        </label>
      </div>

      <p id="library-status" class="status" aria-live="polite">Loading playlists…</p>
      <div id="library-list" class="library-list" aria-live="polite"></div>
      <div id="library-empty" class="empty-state hidden">
        No saved playlists yet. Create one and it will appear here automatically.
      </div>
    </section>
  </main>

  <script src="/static/common.js?v=1"></script>
  <script src="/static/library.js?v=2"></script>
  <script src="/static/home-status.js?v=14"></script>
</body>
</html>
