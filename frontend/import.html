<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070916">
  <script>(function(){try{var t=localStorage.getItem('playlistmuse-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
  <link rel="icon" type="image/png" href="/static/playlistmuse-favicon.png?v=1">
  <title>Import playlist · PlaylistMuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=13">
  <link rel="stylesheet" href="/static/layout.css?v=7">
  <link rel="stylesheet" href="/static/controls.css?v=16">
  <link rel="stylesheet" href="/static/header-navigation.css?v=25">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI playlist studio</p>
      <h1>PlaylistMuse</h1>
    </div>
    <a class="secondary library-header-link" href="/" aria-label="Home" title="Home">Create playlist</a>
  </header>

  <main>
    <section class="hero card" aria-label="Import playlist">
      <label for="import-url">YouTube Music playlist link</label>
      <div class="inline">
        <input id="import-url" type="url" placeholder="https://music.youtube.com/playlist?list=..." autocomplete="off">
        <button id="import-url-submit" class="secondary" type="button" disabled aria-disabled="true">Import</button>
      </div>
      <div id="import-url-guidance" class="import-url-alert hidden" role="alert" aria-live="assertive"></div>
    </section>
  </main>

  <script src="/static/common.js?v=23"></script>
  <script src="/static/import-playlist.js?v=1"></script>
  <script src="/static/home-status.js?v=37"></script>
</body>
</html>
