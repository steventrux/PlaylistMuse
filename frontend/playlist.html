<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070916">
  <title>Playlist · PlaylistMuse</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="stylesheet" href="/static/controls.css?v=4">
  <link rel="stylesheet" href="/static/playlist.css?v=5">
  <link rel="stylesheet" href="/static/compact-cards.css?v=1">
  <link rel="stylesheet" href="/static/playlist-cards.css?v=2">
  <link rel="stylesheet" href="/static/playlist-header.css?v=1">
  <link rel="stylesheet" href="/static/generation.css?v=3">
  <link rel="stylesheet" href="/static/youtube.css?v=4">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI playlist studio</p>
      <h1>PlaylistMuse</h1>
    </div>
  </header>

  <main class="playlist-shell">
    <div class="playlist-toolbar">
      <a class="back-link" href="/">← Create another playlist</a>
    </div>

    <section class="card playlist-card">
      <p class="eyebrow">Your playlist</p>

      <label class="playlist-title-editor" for="playlist-name">
        <span class="visually-hidden">Edit playlist title</span>
        <input id="playlist-name" type="text" maxlength="100" value="Generated playlist" title="Edit playlist title before sending it to YouTube Music">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z" />
          <path d="m13.5 6.5 4 4" />
        </svg>
      </label>

      <p id="playlist-summary" class="playlist-summary"></p>
      <p id="playlist-description" class="playlist-description"></p>

      <section class="youtube-publish" aria-label="Create playlist on YouTube Music">
        <div id="youtube-publish-warning" class="youtube-publish-warning">
          <strong>YouTube Music is not ready</strong>
          <span id="youtube-publish-warning-text">Checking account connection…</span>
        </div>

        <div id="youtube-publish-controls" class="youtube-publish-controls hidden">
          <div class="youtube-publish-copy">
            <strong>Send to YouTube Music</strong>
            <span id="youtube-publish-account">Checking account connection…</span>
          </div>

          <div class="youtube-privacy-group" role="group" aria-label="Playlist privacy">
            <button class="youtube-privacy-option active" type="button" data-privacy="PRIVATE" aria-pressed="true">Private</button>
            <button class="youtube-privacy-option" type="button" data-privacy="UNLISTED" aria-pressed="false">Unlisted</button>
            <button class="youtube-privacy-option" type="button" data-privacy="PUBLIC" aria-pressed="false">Public</button>
          </div>

          <button id="create-youtube-playlist" class="primary" type="button">Create on YouTube Music</button>
        </div>
      </section>
      <p id="youtube-publish-status" class="youtube-publish-status" aria-live="polite"></p>

      <ol id="track-list" class="track-list"></ol>
      <div id="empty-state" class="empty-state hidden">No generated playlist was found in this browser session.</div>
    </section>
  </main>

  <script src="/static/replacement-history.js?v=3"></script>
  <script src="/static/playlist.js?v=12"></script>
  <script src="/static/youtube-publish.js?v=3"></script>
</body>
</html>
