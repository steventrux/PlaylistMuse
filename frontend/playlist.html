<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070916">
  <link rel="icon" type="image/png" href="/static/playlistmuse-favicon.png?v=1">
  <title>Playlist · PlaylistMuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=10">
  <link rel="stylesheet" href="/static/layout.css?v=5">
  <link rel="stylesheet" href="/static/controls.css?v=8">
  <link rel="stylesheet" href="/static/playlist.css?v=5">
  <link rel="stylesheet" href="/static/playlist-editor.css?v=2">
  <link rel="stylesheet" href="/static/playlist-refine.css?v=7">
  <link rel="stylesheet" href="/static/playlist-cards.css?v=4">
  <link rel="stylesheet" href="/static/compact-cards.css?v=7">
  <link rel="stylesheet" href="/static/playlist-header.css?v=12">
  <link rel="stylesheet" href="/static/library-tags.css?v=3">
  <link rel="stylesheet" href="/static/generation.css?v=3">
  <link rel="stylesheet" href="/static/youtube.css?v=5">
  <link rel="stylesheet" href="/static/youtube-results.css?v=4">
  <link rel="stylesheet" href="/static/youtube-success.css?v=1">
  <link rel="stylesheet" href="/static/playlist-reorder.css?v=1">
  <link rel="stylesheet" href="/static/action-controls.css?v=2">
  <link rel="stylesheet" href="/static/header-navigation.css?v=7">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI playlist studio</p>
      <h1>PlaylistMuse</h1>
    </div>
    <a class="secondary library-header-link" href="/static/library.html" aria-label="My playlists" title="My playlists">My playlists</a>
  </header>

  <main class="playlist-shell">
    <section class="card playlist-card">
      <label class="playlist-title-editor" for="playlist-name">
        <span class="visually-hidden">Edit playlist title</span>
        <input id="playlist-name" type="text" maxlength="100" value="Generated playlist" title="Edit playlist title before sending it to YouTube Music">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z" />
          <path d="m13.5 6.5 4 4" />
        </svg>
      </label>

      <div class="playlist-overview">
        <div
          class="playlist-cover"
          role="img"
          aria-label="Playlist cover assembled from representative YouTube Music thumbnails"
        >
          <div id="playlist-cover-grid" class="playlist-cover-grid" aria-hidden="true"></div>
        </div>

        <div class="playlist-overview-copy">
          <p id="playlist-summary" class="playlist-summary"></p>
          <label class="playlist-description-editor" for="playlist-description">
            <span class="visually-hidden">Edit playlist description</span>
            <textarea id="playlist-description" maxlength="2000" rows="4" title="Edit playlist description"></textarea>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z" />
              <path d="m13.5 6.5 4 4" />
            </svg>
          </label>
          <div id="playlist-tags" class="playlist-tags" aria-label="Playlist tags"></div>
          <p id="playlist-tags-status" class="playlist-tag-status hidden" aria-live="polite"></p>
        </div>
      </div>

      <section class="youtube-publish" aria-label="Create playlist on YouTube Music">
        <div id="youtube-publish-loading" class="youtube-publish-loading" role="status" aria-live="polite">
          <span class="youtube-status-spinner" aria-hidden="true"></span>
          <span>Checking YouTube Music…</span>
        </div>

        <div id="youtube-publish-warning" class="youtube-publish-warning hidden">
          <strong>YouTube Music is not ready</strong>
          <span>
            <span id="youtube-publish-warning-text"></span>
            <button id="youtube-open-settings" class="youtube-warning-link" type="button">Open Settings</button>
          </span>
        </div>

        <div id="youtube-publish-controls" class="youtube-publish-controls hidden">
          <div class="youtube-publish-copy">
            <strong>Send to YouTube Music</strong>
          </div>

          <div class="youtube-privacy-group" role="group" aria-label="Playlist privacy">
            <button class="youtube-privacy-option active" type="button" data-privacy="PRIVATE" aria-pressed="true">Private</button>
            <button class="youtube-privacy-option" type="button" data-privacy="UNLISTED" aria-pressed="false">Unlisted</button>
            <button class="youtube-privacy-option" type="button" data-privacy="PUBLIC" aria-pressed="false">Public</button>
          </div>

          <button id="create-youtube-playlist" class="primary" type="button">Create on YouTube Music</button>
        </div>
      </section>
      <p id="youtube-publish-status" class="youtube-publish-status hidden" aria-live="polite"></p>

      <section class="playlist-tracks-section" aria-labelledby="playlist-tracks-heading">
        <div class="playlist-tracks-toolbar">
          <h2 id="playlist-tracks-heading" class="playlist-tracks-heading">Tracks</h2>
          <div id="playlist-draft-actions" class="playlist-draft-actions hidden">
            <button id="add-track" class="secondary" type="button">Add track</button>
            <button id="refine-playlist" class="secondary" type="button">Playlist Studio</button>
          </div>
        </div>
        <div id="playlist-add-track-host" class="playlist-editor-host"></div>
        <div id="playlist-refine-host" class="playlist-editor-host"></div>
        <ol id="track-list" class="track-list"></ol>
        <div id="empty-state" class="empty-state hidden">No generated playlist was found in this browser session.</div>
      </section>
    </section>
  </main>

  <script src="/static/replacement-history.js?v=3"></script>
  <script src="/static/common.js?v=1"></script>
  <script src="/static/playlist-save-status.js?v=2"></script>
  <script src="/static/playlist-mosaic.js?v=1"></script>
  <script src="/static/library-tags.js?v=3"></script>
  <script src="/static/playlist.js?v=20"></script>
  <script src="/static/playlist-add-track.js?v=2"></script>
  <script src="/static/playlist-refine.js?v=7"></script>
  <script src="/static/action-controls.js?v=1"></script>
  <script src="/static/settings-overlay.js?v=1"></script>
  <script data-playlistmuse-footer-status src="/static/home-status.js?v=18"></script>
  <script src="/static/youtube-publish.js?v=15"></script>
</body>
</html>
