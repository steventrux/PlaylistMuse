<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">PlaylistMuse</title>
  <desc id="desc">AI-assisted playlist creation for YouTube Music, shown in a dark violet, magenta and cyan interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1a"/>
      <stop offset="0.52" stop-color="#0b0d20"/>
      <stop offset="1" stop-color="#070916"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181d39" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0c0f21" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(185 55) rotate(38) scale(460 330)">
      <stop stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1240 90) rotate(145) scale(430 300)">
      <stop stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientTransform="translate(900 560) rotate(-90) scale(280 500)">
      <stop stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#01030f" flood-opacity="0.72"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="776" y="82" width="518" height="394" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="560" rx="30" fill="url(#glowA)"/>
  <rect width="1400" height="560" rx="30" fill="url(#glowB)"/>
  <rect width="1400" height="560" rx="30" fill="url(#glowC)"/>
  <rect width="1400" height="560" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="558" rx="29" fill="none" stroke="#a99bff" stroke-opacity="0.18"/>

  <g opacity="0.82">
    <path d="M87 446c76-71 138-71 214 0s138 71 214 0" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
    <path d="M87 468c76-49 138-49 214 0s138 49 214 0" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g transform="translate(88 102)">
    <rect x="0" y="0" width="88" height="30" rx="15" fill="#151a33" stroke="#a99bff" stroke-opacity="0.24"/>
    <circle cx="18" cy="15" r="5" fill="#7ddcff"/>
    <text x="32" y="20" fill="#b8bdd2" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="1.4">SELF-HOSTED</text>

    <text x="0" y="108" fill="#f8f7ff" font-size="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" letter-spacing="-3.2">Playlist</text>
    <text x="238" y="108" fill="url(#brand)" font-size="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" letter-spacing="-3.2">Muse</text>

    <text x="0" y="157" fill="#d6d8e5" font-size="25" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">Describe a mood. Pick a seed song.</text>
    <text x="0" y="194" fill="#9aa1bd" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif">Build, refine and publish a playlist.</text>

    <g transform="translate(0 242)">
      <rect width="176" height="46" rx="23" fill="url(#brand)"/>
      <path d="M25 15l15 8-15 8z" fill="#ffffff"/>
      <text x="54" y="30" fill="#ffffff" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">AI-assisted</text>

      <rect x="192" width="172" height="46" rx="23" fill="#11152c" stroke="#a99bff" stroke-opacity="0.25"/>
      <text x="218" y="29" fill="#c6c9da" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">YouTube Music</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="748" y="54" width="574" height="450" rx="32" fill="#070916" stroke="#b79cff" stroke-opacity="0.32"/>
    <rect x="776" y="82" width="518" height="394" rx="24" fill="url(#panel)"/>
  </g>

  <g clip-path="url(#screenClip)">
    <rect x="776" y="82" width="518" height="394" fill="url(#panel)"/>
    <rect x="776" y="82" width="518" height="42" fill="#0d1124"/>
    <circle cx="800" cy="103" r="5" fill="#fb7185" opacity="0.8"/>
    <circle cx="818" cy="103" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="836" cy="103" r="5" fill="#4ade80" opacity="0.8"/>
    <rect x="878" y="94" width="236" height="18" rx="9" fill="#151a33"/>
    <circle cx="1264" cy="103" r="10" fill="#151a33" stroke="#38bdf8" stroke-opacity="0.5"/>

    <text x="806" y="155" fill="#7ddcff" font-size="10" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="1.5">AI PLAYLIST STUDIO</text>
    <text x="806" y="183" fill="url(#brand)" font-size="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" letter-spacing="-1">PlaylistMuse</text>

    <rect x="806" y="207" width="210" height="36" rx="18" fill="#252b50"/>
    <rect x="810" y="211" width="100" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.34" stroke="#b79cff" stroke-opacity="0.45"/>
    <text x="830" y="230" fill="#f8f7ff" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">From Prompt</text>
    <text x="929" y="230" fill="#9aa1bd" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">From Seed</text>

    <rect x="806" y="258" width="458" height="82" rx="12" fill="#090c1b" stroke="#a99bff" stroke-opacity="0.26"/>
    <text x="824" y="284" fill="#c9ccdc" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">A slow-burning road-trip playlist with blues rock,</text>
    <text x="824" y="306" fill="#c9ccdc" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">warm guitars and a steady night-drive mood...</text>
    <rect x="824" y="320" width="176" height="3" rx="1.5" fill="url(#brand)" opacity="0.65"/>

    <g transform="translate(806 358)">
      <rect width="76" height="38" rx="10" fill="#0a0d1d" stroke="#a99bff" stroke-opacity="0.22"/>
      <text x="12" y="16" fill="#8088a8" font-size="9" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">TRACKS</text>
      <text x="12" y="31" fill="#f8f7ff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">25</text>

      <rect x="92" y="0" width="112" height="38" rx="10" fill="#0a0d1d" stroke="#a99bff" stroke-opacity="0.22"/>
      <circle cx="108" cy="19" r="6" fill="#8b5cf6"/>
      <path d="M105 19l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="121" y="23" fill="#c9ccdc" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">No live</text>

      <rect x="216" y="0" width="112" height="38" rx="10" fill="#0a0d1d" stroke="#a99bff" stroke-opacity="0.22"/>
      <circle cx="232" cy="19" r="6" fill="#ec4899"/>
      <path d="M229 19l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="245" y="23" fill="#c9ccdc" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">No covers</text>

      <rect x="340" y="0" width="118" height="38" rx="10" fill="#0a0d1d" stroke="#a99bff" stroke-opacity="0.22"/>
      <circle cx="356" cy="19" r="6" fill="#38bdf8"/>
      <path d="M353 19l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="369" y="23" fill="#c9ccdc" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">No remixes</text>
    </g>

    <rect x="806" y="414" width="458" height="42" rx="11" fill="url(#brand)"/>
    <path d="M934 426l14 9-14 9z" fill="#ffffff"/>
    <text x="960" y="441" fill="#ffffff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850">Generate playlist</text>
  </g>

  <g opacity="0.82">
    <circle cx="706" cy="125" r="5" fill="#8b5cf6"/>
    <circle cx="1337" cy="415" r="4" fill="#38bdf8"/>
    <circle cx="670" cy="445" r="3" fill="#ec4899"/>
  </g>
</svg>
