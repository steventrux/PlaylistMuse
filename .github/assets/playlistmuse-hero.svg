<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">PlaylistMuse</title>
  <desc id="desc">PlaylistMuse, AI-assisted playlist creation for YouTube Music.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1a"/>
      <stop offset="0.55" stop-color="#0b0d20"/>
      <stop offset="1" stop-color="#070916"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(120 20) rotate(35) scale(560 300)">
      <stop stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1320 20) rotate(145) scale(500 280)">
      <stop stop-color="#ec4899" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientTransform="translate(780 380) rotate(-90) scale(210 520)">
      <stop stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".032"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#01030f" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1400" height="360" rx="28" fill="url(#glowB)"/>
  <rect width="1400" height="360" rx="28" fill="url(#glowC)"/>
  <rect width="1400" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="358" rx="27" fill="none" stroke="#a99bff" stroke-opacity=".18"/>

  <g transform="translate(82 62)">
    <rect width="126" height="32" rx="16" fill="#151a33" stroke="#a99bff" stroke-opacity=".3"/>
    <circle cx="18" cy="16" r="5" fill="#7ddcff"/>
    <text x="32" y="21" fill="#b8bdd2" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="1.35">SELF-HOSTED</text>

    <text x="0" y="112" fill="url(#brand)" font-size="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" letter-spacing="-4">PlaylistMuse</text>
    <text x="2" y="157" fill="#f8f7ff" font-size="27" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">AI-assisted playlists, grounded in YouTube Music.</text>
    <text x="2" y="197" fill="#9aa1bd" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif">Describe a sound, refine every track and publish from the browser.</text>

    <g transform="translate(0 228)">
      <rect width="172" height="42" rx="21" fill="#11152c" stroke="#7ddcff" stroke-opacity=".32"/>
      <circle cx="20" cy="21" r="5" fill="#7ddcff"/>
      <text x="34" y="27" fill="#d6d8e5" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Natural language</text>

      <rect x="188" width="186" height="42" rx="21" fill="#11152c" stroke="#b79cff" stroke-opacity=".34"/>
      <circle cx="208" cy="21" r="5" fill="#b79cff"/>
      <text x="222" y="27" fill="#d6d8e5" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Multiple AI providers</text>

      <rect x="390" width="158" height="42" rx="21" fill="#11152c" stroke="#f884c2" stroke-opacity=".34"/>
      <circle cx="410" cy="21" r="5" fill="#f884c2"/>
      <text x="424" y="27" fill="#d6d8e5" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Editable results</text>
    </g>
  </g>

  <g transform="translate(890 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="414" height="224" rx="26" fill="#0c0f21" stroke="#b79cff" stroke-opacity=".3"/>
    <rect x="24" y="25" width="366" height="46" rx="14" fill="#151a33"/>
    <text x="45" y="54" fill="#f8f7ff" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Prompt or seed song</text>

    <path d="M207 78v23" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
    <path d="M199 94l8 8 8-8" fill="none" stroke="#b79cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="111" width="104" height="70" rx="16" fill="#11152c" stroke="#8b5cf6" stroke-opacity=".4"/>
    <text x="76" y="139" text-anchor="middle" fill="#b79cff" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing=".9">AI</text>
    <text x="76" y="160" text-anchor="middle" fill="#d6d8e5" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">Generate</text>

    <path d="M136 146h34" stroke="#a99bff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M163 140l8 6-8 6" fill="none" stroke="#a99bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="178" y="111" width="104" height="70" rx="16" fill="#11152c" stroke="#ec4899" stroke-opacity=".4"/>
    <text x="230" y="139" text-anchor="middle" fill="#f884c2" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing=".9">YTM</text>
    <text x="230" y="160" text-anchor="middle" fill="#d6d8e5" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650">Resolve</text>

    <path d="M290 146h34" stroke="#a99bff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M317 140l8 6-8 6" fill="none" stroke="#a99bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="332" y="111" width="58" height="70" rx="16" fill="url(#brand)"/>
    <path d="M353 136l9 6-9 6z" fill="#fff"/>
    <text x="361" y="166" text-anchor="middle" fill="#fff" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">Publish</text>

    <text x="24" y="205" fill="#8088a8" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif">Create · refine · publish</text>
  </g>
</svg>
