name: Bug report
description: Report a reproducible problem with PlaylistMuse
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough information to reproduce it.

        If possible, open **PlaylistMuse → Settings → Diagnostics**, download the diagnostic report, and attach the ZIP below. Do not upload `.env`, raw configuration files, API keys, OAuth tokens, cookies, or other credentials.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and where you encountered it.
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of actions that reliably triggers the problem.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Click ...
        4. The error appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect PlaylistMuse to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What did PlaylistMuse do instead? Include the visible error message if there was one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PlaylistMuse version / build
      description: Copy the running build shown in Settings → Diagnostics, for example v0.2.1 · stable.
      placeholder: v0.2.1 · stable
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker image — latest
        - Docker image — versioned tag
        - Docker Compose / built from source
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: For example Firefox 141 on Linux, Chrome on Android, Safari on macOS.
      placeholder: Browser version · operating system
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: input
    id: ai
    attributes:
      label: AI provider and model
      description: Include this when the problem concerns generation, refinement, prompt analysis, or AI settings. Never include the API key.
      placeholder: OpenAI · model-name

  - type: input
    id: integrations
    attributes:
      label: Integrations involved
      description: Note whether Last.fm and/or YouTube Music were involved.
      placeholder: Last.fm, YouTube Music, neither

  - type: input
    id: reference
    attributes:
      label: Error reference
      description: If PlaylistMuse displayed an ID beginning with PM-, paste it here.
      placeholder: PM-20260811-ABC123

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Drag the ZIP downloaded from Settings → Diagnostics here. GitHub will upload it as an attachment.
      placeholder: Attach playlistmuse-diagnostics-....zip here if available.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Add screenshots or other useful context. Remove personal or sensitive information first.

  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive data check
      options:
        - label: I have not included API keys, passwords, OAuth tokens, cookies, `.env`, or raw credential/configuration files.
          required: true
