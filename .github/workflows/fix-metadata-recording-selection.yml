name: Fix metadata recording selection

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-metadata-recording-selection.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply focused fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}: {old[:100]!r}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/metadata_validation.py",
              'METADATA_CACHE_VERSION = "2"\n',
              'METADATA_CACHE_VERSION = "3"\n',
          )

          marker = '''\n\nasync def _rate_limited_get(\n'''
          helper = '''\n\ndef _select_best_metadata(\n    candidates: list[TrackMetadata],\n) -> TrackMetadata:\n    """Prefer the original recording among equivalently strong matches."""\n    if not candidates:\n        raise ValueError("No metadata candidates were provided")\n\n    best_score = max(candidate.match_score for candidate in candidates)\n    competitive_floor = max(MIN_MATCH_SCORE, best_score - 0.03)\n    competitive = [\n        candidate\n        for candidate in candidates\n        if candidate.match_score >= competitive_floor\n    ]\n    return min(\n        competitive,\n        key=lambda candidate: (\n            _date_key(candidate.original_release_date),\n            -candidate.match_score,\n        ),\n    )\n'''
          path = Path("backend/metadata_validation.py")
          text = path.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("Could not locate MusicBrainz request helper")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding="utf-8")

          replace_once(
              "backend/metadata_validation.py",
              '''        metadata = max(\n            (_metadata_from_recording(item, artist, title) for item in candidates),\n            key=lambda item: item.match_score,\n        )\n''',
              '''        metadata = _select_best_metadata(\n            [\n                _metadata_from_recording(item, artist, title)\n                for item in candidates\n            ]\n        )\n''',
          )

          test_path = Path("tests/test_metadata_validation.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '    _metadata_from_recording,\n',
              '    _metadata_from_recording,\n    _select_best_metadata,\n',
              1,
          )
          regression = '''\n\ndef test_recording_selection_prefers_original_over_higher_scored_reissue():\n    original = _metadata_from_recording(\n        {\n            "id": "original-recording",\n            "title": "Crazy Train",\n            "score": 98,\n            "artist-credit": [\n                {\n                    "name": "Ozzy Osbourne",\n                    "artist": {"name": "Ozzy Osbourne", "country": "GB"},\n                }\n            ],\n            "releases": [\n                {\n                    "title": "Blizzard of Ozz",\n                    "date": "1980-09-20",\n                    "release-group": {\n                        "id": "original-release-group",\n                        "title": "Blizzard of Ozz",\n                        "first-release-date": "1980-09-20",\n                    },\n                }\n            ],\n        },\n        "Ozzy Osbourne",\n        "Crazy Train",\n    )\n    reissue = _metadata_from_recording(\n        {\n            "id": "reissue-recording",\n            "title": "Crazy Train",\n            "score": 100,\n            "artist-credit": [\n                {\n                    "name": "Ozzy Osbourne",\n                    "artist": {"name": "Ozzy Osbourne", "country": "GB"},\n                }\n            ],\n            "releases": [\n                {\n                    "title": "Blizzard of Ozz (40th Anniversary Expanded Edition)",\n                    "date": "2021-09-17",\n                    "release-group": {\n                        "id": "reissue-release-group",\n                        "title": "Blizzard of Ozz (40th Anniversary Expanded Edition)",\n                        "first-release-date": "2021-09-17",\n                    },\n                }\n            ],\n        },\n        "Ozzy Osbourne",\n        "Crazy Train",\n    )\n\n    selected = _select_best_metadata([reissue, original])\n\n    assert selected.recording_mbid == "original-recording"\n    assert selected.original_release_year == 1980\n    result = validate_metadata(\n        selected,\n        MetadataConstraints(release_year_from=1986, release_year_to=1999),\n    )\n    assert result.status == "invalid"\n'''
          marker = '\n\ndef test_sqlite_cache_round_trip(tmp_path: Path):\n'
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate metadata cache test insertion point")
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/metadata_validation.py tests/test_metadata_validation.py
          git diff --cached --quiet && exit 0
          git commit -m "Prefer original recordings during metadata validation"
          git push origin HEAD:dev
