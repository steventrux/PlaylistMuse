name: Finalize library pagination

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/finalize-library-pagination.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Finalize pagination edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/library.js')
          text = path.read_text(encoding='utf-8')
          old = "      $('library-empty').classList.add('hidden');\n      updateLibraryCount(0);\n      setStatus(error.message || String(error), true);"
          new = "      $('library-empty').classList.add('hidden');\n      updateLibraryCount(0);\n      renderPagination({totalPages: 0});\n      setStatus(error.message || String(error), true);"
          if old not in text:
              raise SystemExit('library error-state marker missing')
          text = text.replace(old, new, 1)
          text = text.replace("  }\n  function setStatusFilter(filter) {", "  }\n\n  function setStatusFilter(filter) {", 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/finalize-library-pagination.yml').unlink()
          PY

      - name: Commit final pagination cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/library.js .github/workflows/finalize-library-pagination.yml
          git diff --cached --check
          git commit -m "Handle library pagination load errors"
          git push origin HEAD:dev
