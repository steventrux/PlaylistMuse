name: MusicBrainz smoke test

on:
  push:
    branches:
      - phase-0-regression-safety
    paths:
      - scripts/musicbrainz_options_smoke.py
      - backend/metadata/musicbrainz_policy.py
      - backend/metadata/musicbrainz_relations.py
      - .github/workflows/musicbrainz-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  option-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real MusicBrainz option matrix
        env:
          PLAYLISTMUSE_MUSICBRAINZ_CONTACT: https://github.com/steventrux/PlaylistMuse
        run: python scripts/musicbrainz_options_smoke.py

      - name: Upload option matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicbrainz-options-smoke-report
          path: artifacts/musicbrainz-options-smoke-report.json
          if-no-files-found: warn
