name: MusicBrainz smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real MusicBrainz smoke test
        env:
          PLAYLISTMUSE_MUSICBRAINZ_CONTACT: https://github.com/steventrux/PlaylistMuse
        run: python scripts/musicbrainz_smoke.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicbrainz-smoke-report
          path: artifacts/musicbrainz-smoke-report.json
          if-no-files-found: warn
