name: Fix favicon cache

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-favicon-cache.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply favicon cache fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'href="/static/favicon.png"'
          new = 'href="/static/favicon.png?v=2"'
          for name in ('index.html', 'playlist.html', 'library.html'):
              path = Path('frontend') / name
              text = path.read_text(encoding='utf-8')
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'{name}: favicon reference not found')
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_static_assets.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_favicon_uses_exact_current_logo_and_cache_busting() -> None:'
          if marker not in tests:
              tests += '''\n\ndef test_favicon_uses_exact_current_logo_and_cache_busting() -> None:\n    expected_link = (\n        '<link rel="icon" type="image/png" href="/static/favicon.png?v=2">'\n    )\n    for html_name in ("index.html", "playlist.html", "library.html"):\n        assert expected_link in _html(html_name)\n\n    favicon = (FRONTEND / "favicon.png").read_bytes()\n    assert sha256(favicon).hexdigest() == (\n        "2afccaf81bc677f9dcc49b7e5bedb5462c5685c1530cbfa1ae829af50b07a918"\n    )\n'''
              test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/fix-favicon-cache.yml').unlink()
          PY

      - name: Commit favicon fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/playlist.html frontend/library.html tests/test_static_assets.py .github/workflows/fix-favicon-cache.yml
          git commit -m "Fix favicon cache busting"
          git push origin HEAD:dev
