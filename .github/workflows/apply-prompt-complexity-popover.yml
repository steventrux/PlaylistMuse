name: Apply compact prompt complexity popover

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-prompt-complexity-popover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Replace legacy complexity box with compact popover
        run: python .github/scripts/apply_prompt_complexity_popover.py

      - name: Verify focused frontend tests
        run: |
          node tests/test_prompt_complexity.cjs
          python -m pytest tests/test_static_assets.py -q

      - name: Commit compact complexity control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/style.css frontend/prompt-complexity.css frontend/prompt-complexity.js tests/test_static_assets.py
          git commit -m "Replace prompt complexity box with compact popover"
          git push origin dev
