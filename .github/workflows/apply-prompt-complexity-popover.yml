name: Apply compact prompt complexity popover

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-prompt-complexity-popover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Replace legacy complexity box with compact popover
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('frontend/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('/static/style.css?v=9', '/static/style.css?v=10', 1)
          controls_ref = '  <link rel="stylesheet" href="/static/controls.css?v=7">\n'
          complexity_ref = '  <link rel="stylesheet" href="/static/prompt-complexity.css?v=1">\n'
          if index.count(controls_ref) != 1:
              raise SystemExit('Unexpected controls stylesheet reference')
          index = index.replace(controls_ref, controls_ref + complexity_ref, 1)

          old_markup = '''        <div id="prompt-complexity" class="prompt-complexity hidden" aria-live="polite">
          <div class="prompt-complexity-heading">
            <span>Request complexity</span>
            <strong id="prompt-complexity-score"></strong>
          </div>
          <p id="prompt-complexity-summary"></p>
          <span id="prompt-clarity" class="prompt-clarity"></span>
        </div>'''
          new_markup = '''        <div id="prompt-complexity" class="prompt-complexity hidden">
          <button
            id="prompt-complexity-trigger"
            class="prompt-complexity-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="prompt-complexity-popover"
            aria-label="Show request complexity"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 16a8 8 0 1 1 16 0" />
              <path d="m12 16 4-5" />
              <path d="M7 16h10" />
            </svg>
          </button>

          <div
            id="prompt-complexity-popover"
            class="prompt-complexity-popover"
            role="region"
            aria-labelledby="prompt-complexity-title"
            hidden
          >
            <div class="prompt-complexity-heading">
              <span id="prompt-complexity-title">Request complexity</span>
              <strong id="prompt-complexity-score"></strong>
            </div>
            <div class="prompt-complexity-meter" aria-hidden="true"><span></span></div>
            <p id="prompt-complexity-summary"></p>
            <span id="prompt-clarity" class="prompt-clarity"></span>
          </div>
        </div>'''
          if index.count(old_markup) != 1:
              raise SystemExit('Legacy prompt complexity markup did not match')
          index = index.replace(old_markup, new_markup, 1)
          if index.count('/static/prompt-complexity.js?v=6') != 1:
              raise SystemExit('Unexpected prompt complexity script reference')
          index = index.replace('/static/prompt-complexity.js?v=6', '/static/prompt-complexity.js?v=7', 1)
          index_path.write_text(index, encoding='utf-8')

          style_path = Path('frontend/style.css')
          style = style_path.read_text(encoding='utf-8')
          old_styles = '''.prompt-complexity {
  --complexity-hue: 120;
  --complexity-color: hsl(var(--complexity-hue) 78% 68%);
  margin-top: 10px;
  padding: 11px 13px;
  border: 1px solid hsl(var(--complexity-hue) 72% 58% / .24);
  border-radius: 10px;
  background:
    linear-gradient(90deg, hsl(var(--complexity-hue) 72% 50% / .08), transparent 38%),
    rgba(139, 92, 246, .04);
  color: var(--text-secondary);
  font-size: .78rem;
}
.prompt-complexity-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.prompt-complexity-heading > span {
  color: var(--complexity-color);
  font-weight: 700;
}
.prompt-complexity-heading strong {
  color: var(--complexity-color);
  font-size: .82rem;
  font-weight: 800;
}
.prompt-complexity p { margin: 6px 0 0; }
.prompt-clarity { display: block; margin-top: 4px; color: #86efac; }

'''
          if style.count(old_styles) != 1:
              raise SystemExit('Legacy prompt complexity styles did not match')
          style_path.write_text(style.replace(old_styles, '', 1), encoding='utf-8')

          Path('frontend/prompt-complexity.css').write_text('''/* Compact prompt analysis trigger and popover. */

.prompt-complexity {
  --complexity-hue: 120;
  --complexity-score: 0%;
  --complexity-color: hsl(var(--complexity-hue) 78% 68%);
  position: relative;
  width: max-content;
  margin-top: 8px;
}

.prompt-complexity-trigger {
  display: grid;
  width: 32px;
  height: 32px;
  padding: 0;
  place-items: center;
  border: 1px solid hsl(var(--complexity-hue) 72% 58% / .32);
  border-radius: 10px;
  background: rgba(10, 13, 30, .72);
  color: var(--complexity-color);
  box-shadow: none;
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}

.prompt-complexity-trigger:hover,
.prompt-complexity-trigger[aria-expanded="true"] {
  border-color: hsl(var(--complexity-hue) 76% 64% / .58);
  background: hsl(var(--complexity-hue) 72% 42% / .12);
}

.prompt-complexity-trigger:hover {
  transform: translateY(-1px);
}

.prompt-complexity-trigger svg {
  width: 17px;
  height: 17px;
  overflow: visible;
}

.prompt-complexity-trigger path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.prompt-complexity-popover {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 15;
  width: min(320px, calc(100vw - 64px));
  padding: 14px 15px;
  border: 1px solid hsl(var(--complexity-hue) 72% 58% / .28);
  border-radius: 13px;
  background: rgba(8, 11, 27, .97);
  color: var(--text-secondary);
  box-shadow: 0 16px 36px rgba(1, 3, 15, .46);
  backdrop-filter: blur(18px);
  font-size: .78rem;
}

.prompt-complexity-popover::before {
  content: "";
  position: absolute;
  bottom: 100%;
  left: 10px;
  width: 9px;
  height: 9px;
  border-top: 1px solid hsl(var(--complexity-hue) 72% 58% / .28);
  border-left: 1px solid hsl(var(--complexity-hue) 72% 58% / .28);
  background: rgba(8, 11, 27, .97);
  transform: translateY(5px) rotate(45deg);
}

.prompt-complexity-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.prompt-complexity-heading > span {
  color: var(--text-primary);
  font-weight: 750;
}

.prompt-complexity-heading strong {
  color: var(--complexity-color);
  font-size: .8rem;
  font-weight: 800;
}

.prompt-complexity-meter {
  position: relative;
  height: 4px;
  margin: 12px 0 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #4ade80 0%, #fbbf24 50%, #fb7185 100%);
}

.prompt-complexity-meter span {
  position: absolute;
  top: 50%;
  left: var(--complexity-score);
  width: 10px;
  height: 10px;
  border: 2px solid #f8f7ff;
  border-radius: 50%;
  background: var(--complexity-color);
  box-shadow: 0 0 0 2px rgba(8, 11, 27, .9);
  transform: translate(-50%, -50%);
}

.prompt-complexity-popover p {
  margin: 0;
  line-height: 1.45;
}

.prompt-clarity {
  display: block;
  margin-top: 5px;
  color: #86efac;
}

@media (max-width: 520px) {
  .prompt-complexity-popover {
    width: min(300px, calc(100vw - 56px));
  }
}
''', encoding='utf-8')

          Path('frontend/prompt-complexity.js').write_text('''(() => {
  'use strict';

  const DEBOUNCE_MS = 500;

  function complexityHue(value) {
    const score = Math.max(0, Math.min(100, Number(value) || 0));
    return Math.round(120 - (score * 1.2));
  }

  function displayLevel(level) {
    return level === 'Detailed' ? 'Simple' : level;
  }

  function clarityText(result) {
    const level = String(result.clarity_level || '');
    if (['excellent', 'good'].includes(level.toLowerCase())) return `Clarity: ${level}`;
    const issues = Array.isArray(result.issues) ? result.issues : [];
    const issueSummary = issues.length ? ` · ${issues.join(' · ')}` : '';
    return `Clarity: ${level}${issueSummary}`;
  }

  function analysisPayload(prompt, settings = {}) {
    return {
      prompt: String(prompt || '').trim(),
      track_count: Math.max(5, Math.min(100, Number.parseInt(settings.trackCount, 10) || 25)),
      options: {
        exclude_live: Boolean(settings.excludeLive),
        exclude_covers: Boolean(settings.excludeCovers),
        exclude_remixes: Boolean(settings.excludeRemixes),
      },
    };
  }

  function init() {
    const prompt = document.getElementById('prompt');
    const component = document.getElementById('prompt-complexity');
    const trigger = document.getElementById('prompt-complexity-trigger');
    const popover = document.getElementById('prompt-complexity-popover');
    const score = document.getElementById('prompt-complexity-score');
    const summary = document.getElementById('prompt-complexity-summary');
    const clarity = document.getElementById('prompt-clarity');
    if (!prompt || !component || !trigger || !popover || !score || !summary || !clarity) return;

    const cache = new Map();
    let timer = null;
    let controller = null;
    let requestSequence = 0;

    const settings = () => ({
      trackCount: document.getElementById('track-count')?.value,
      excludeLive: document.getElementById('exclude-live')?.checked,
      excludeCovers: document.getElementById('exclude-covers')?.checked,
      excludeRemixes: document.getElementById('exclude-remixes')?.checked,
    });

    const setPopoverOpen = (open) => {
      trigger.setAttribute('aria-expanded', String(open));
      trigger.setAttribute('aria-label', open ? 'Hide request complexity' : 'Show request complexity');
      popover.hidden = !open;
    };

    const hideComponent = () => {
      controller?.abort();
      component.classList.add('hidden');
      setPopoverOpen(false);
    };

    const render = (result) => {
      const numericScore = Math.max(0, Math.min(100, Number(result.score) || 0));
      const level = displayLevel(result.level);
      component.style.setProperty('--complexity-hue', complexityHue(numericScore));
      component.style.setProperty('--complexity-score', `${numericScore}%`);
      score.textContent = `${level} · ${numericScore}/100`;
      trigger.title = `Request complexity: ${level} · ${numericScore}/100`;
      const constraintCount = result.hard_constraints + result.soft_constraints;
      summary.textContent = [
        `${result.dimensions} musical ${result.dimensions === 1 ? 'dimension' : 'dimensions'}`,
        `${constraintCount} ${constraintCount === 1 ? 'constraint' : 'constraints'}`,
        `${result.structures} structural ${result.structures === 1 ? 'rule' : 'rules'}`,
      ].join(' · ');
      clarity.textContent = clarityText(result);
      component.classList.remove('hidden');
    };

    const analyze = async () => {
      const payload = analysisPayload(prompt.value, settings());
      if (!payload.prompt) {
        hideComponent();
        return;
      }

      const key = JSON.stringify(payload);
      if (cache.has(key)) {
        render(cache.get(key));
        return;
      }

      controller?.abort();
      controller = new AbortController();
      const sequence = ++requestSequence;
      try {
        const response = await fetch('/api/prompts/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: key,
          signal: controller.signal,
        });
        if (!response.ok) throw new Error('Prompt analysis unavailable');
        const result = await response.json();
        if (sequence !== requestSequence) return;
        cache.set(key, result);
        render(result);
      } catch (error) {
        if (error.name !== 'AbortError' && sequence === requestSequence) hideComponent();
      }
    };

    const schedule = () => {
      window.clearTimeout(timer);
      controller?.abort();
      timer = window.setTimeout(analyze, DEBOUNCE_MS);
    };

    trigger.addEventListener('click', () => {
      setPopoverOpen(trigger.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('click', (event) => {
      if (!component.contains(event.target)) setPopoverOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setPopoverOpen(false);
    });
    prompt.addEventListener('input', schedule);
    ['track-count', 'exclude-live', 'exclude-covers', 'exclude-remixes'].forEach((id) => {
      document.getElementById(id)?.addEventListener('change', schedule);
    });
  }

  window.PlaylistMusePromptComplexity = {
    analysisPayload,
    clarityText,
    complexityHue,
    displayLevel,
    debounceMs: DEBOUNCE_MS,
  };
  if (typeof document !== 'undefined') init();
})();
''', encoding='utf-8')

