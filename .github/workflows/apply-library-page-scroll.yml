name: Apply library page scroll fix

on:
  push:
    paths:
      - '.github/workflows/apply-library-page-scroll.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply pagination scroll fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/library.js')
          text = path.read_text()
          old = "    $('library-list').scrollIntoView({block: 'start'});\n"
          new = "    window.scrollTo({top: 0, left: 0});\n"
          if old not in text:
              raise SystemExit('Expected library pagination scroll code not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/test_library_page_scroll.py')
          test_path.write_text(
              "from pathlib import Path\n\n\n"
              "def test_library_pagination_scrolls_to_page_top() -> None:\n"
              "    source = Path('frontend/library.js').read_text()\n"
              "    assert \"window.scrollTo({top: 0, left: 0});\" in source\n"
              "    assert \"$('library-list').scrollIntoView({block: 'start'});\" not in source\n"
          )
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/library.js tests/test_library_page_scroll.py
          git commit -m 'Scroll to top on library page change'
          git push
