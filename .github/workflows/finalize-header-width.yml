name: Finalize header width alignment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/finalize-header-width.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update cache references and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('frontend/index.html', 'frontend/playlist.html'):
              path = Path(filename)
              content = path.read_text(encoding='utf-8')
              old = '/static/layout.css?v=4'
              if content.count(old) != 1:
                  raise SystemExit(f'Unexpected layout reference count in {filename}')
              path.write_text(content.replace(old, '/static/layout.css?v=5', 1), encoding='utf-8')

          test_path = Path('tests/test_static_assets.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'def test_home_and_results_share_narrower_content_width_and_complete_wordmark() -> None:',
              'def test_header_home_and_results_share_content_width() -> None:',
              1,
          )
          if tests.count('layout.css?v=4') != 2:
              raise SystemExit('Unexpected layout v4 assertion count')
          tests = tests.replace('layout.css?v=4', 'layout.css?v=5')
          old_selector = 'assert "main,\\n.playlist-shell" in layout'
          new_selector = 'assert ".app-header,\\nmain,\\n.playlist-shell" in layout'
          if old_selector not in tests:
              raise SystemExit('Expected width selector assertion not found')
          tests = tests.replace(old_selector, new_selector, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Commit alignment references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/playlist.html tests/test_static_assets.py
          git commit -m "Finalize header width alignment"
          git push origin dev
