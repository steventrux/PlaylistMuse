name: Fix canonical release year

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-canonical-release-year.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply canonical release-year fix
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          module_path = Path("backend/metadata_validation.py")
          text = module_path.read_text(encoding="utf-8")

          if 'METADATA_CACHE_VERSION = "3"' not in text:
              raise SystemExit("Unexpected metadata cache version")
          text = text.replace(
              'METADATA_CACHE_VERSION = "3"',
              'METADATA_CACHE_VERSION = "4"',
              1,
          )

          function_start = text.index("def _select_best_metadata(")
          function_end = text.index("\n\nasync def _rate_limited_get", function_start)
          replacement = dedent(
              '''
              def _select_best_metadata(
                  candidates: list[TrackMetadata],
              ) -> TrackMetadata:
                  """Use the earliest first release among confidently equivalent recordings.

                  Reissues and remasters remain valid playback choices. This selection only
                  normalizes the canonical first-release metadata used for hard constraints.
                  """
                  if not candidates:
                      raise ValueError("No metadata candidates were provided")

                  reliable_dated = [
                      candidate
                      for candidate in candidates
                      if candidate.match_score >= MIN_MATCH_SCORE
                      and candidate.original_release_date
                  ]
                  if reliable_dated:
                      return min(
                          reliable_dated,
                          key=lambda candidate: (
                              _date_key(candidate.original_release_date),
                              -candidate.match_score,
                          ),
                      )
                  return max(candidates, key=lambda candidate: candidate.match_score)
              '''
          ).strip()
          text = text[:function_start] + replacement + text[function_end:]

          if '"limit": "8",' not in text:
              raise SystemExit("Could not locate MusicBrainz result limit")
          text = text.replace('"limit": "8",', '"limit": "20",', 1)
          module_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_metadata_original_release_selection.py")
          test_path.write_text(
              dedent(
                  '''
                  from backend.metadata_validation import (
                      MetadataConstraints,
                      _metadata_from_recording,
                      _select_best_metadata,
                      validate_metadata,
                  )


                  def _recording(
                      *,
                      recording_id: str,
                      artist: str,
                      title: str,
                      api_score: int,
                      release_title: str,
                      release_date: str,
                  ) -> dict:
                      return {
                          "id": recording_id,
                          "title": title,
                          "score": api_score,
                          "artist-credit": [
                              {
                                  "name": artist,
                                  "artist": {"name": artist},
                              }
                          ],
                          "releases": [
                              {
                                  "title": release_title,
                                  "date": release_date,
                                  "release-group": {
                                      "id": f"{recording_id}-group",
                                      "title": release_title,
                                      "first-release-date": release_date,
                                  },
                              }
                          ],
                      }


                  def test_compilation_date_cannot_replace_original_release_year():
                      compilation = _metadata_from_recording(
                          _recording(
                              recording_id="compilation-recording",
                              artist="Survivor",
                              title="Eye of the Tiger",
                              api_score=100,
                              release_title="Ces années-là : 1976/1985",
                              release_date="1993-02-09",
                          ),
                          "Survivor",
                          "Eye of the Tiger",
                      )
                      original = _metadata_from_recording(
                          _recording(
                              recording_id="original-recording",
                              artist="Survivor",
                              title="Eye of the Tiger",
                              api_score=35,
                              release_title="Eye of the Tiger",
                              release_date="1982-05-29",
                          ),
                          "Survivor",
                          "Eye of the Tiger",
                      )

                      selected = _select_best_metadata([compilation, original])

                      assert selected.recording_mbid == "original-recording"
                      assert selected.original_release_year == 1982
                      result = validate_metadata(
                          selected,
                          MetadataConstraints(
                              release_year_from=1986,
                              release_year_to=1999,
                          ),
                      )
                      assert result.status == "invalid"


                  def test_reissue_remains_valid_when_original_year_is_in_range():
                      reissue = _metadata_from_recording(
                          _recording(
                              recording_id="reissue-recording",
                              artist="Example Artist",
                              title="Example Song",
                              api_score=100,
                              release_title="Example Song (2020 Remaster)",
                              release_date="2020-06-01",
                          ),
                          "Example Artist",
                          "Example Song",
                      )
                      original = _metadata_from_recording(
                          _recording(
                              recording_id="original-recording",
                              artist="Example Artist",
                              title="Example Song",
                              api_score=40,
                              release_title="Example Album",
                              release_date="1988-03-12",
                          ),
                          "Example Artist",
                          "Example Song",
                      )

                      selected = _select_best_metadata([reissue, original])

                      assert selected.original_release_year == 1988
                      result = validate_metadata(
                          selected,
                          MetadataConstraints(
                              release_year_from=1986,
                              release_year_to=1999,
                          ),
                      )
                      assert result.status == "valid"
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/metadata_validation.py tests/test_metadata_original_release_selection.py
          git diff --cached --quiet && exit 0
          git commit -m "Use canonical first release across MusicBrainz recordings"
          git push origin HEAD:dev
