name: Apply transparent banner

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/apply-transparent-banner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          persist-credentials: true

      - name: Remove banner background only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/assets/playlistmuse-hero.svg')
          source = path.read_text(encoding='utf-8')

          title_line = next(line for line in source.splitlines() if '>PlaylistMuse</text>' in line)
          image_match = re.search(r'<image href="(data:image/jpeg;base64,[^"]+)"', source)
          if not image_match:
              raise SystemExit('Embedded screenshot not found')
          image_data = image_match.group(1)

          start_marker = '  <rect width="1600" height="400" fill="#0A0B18"/>'
          end_marker = '  <!-- background: real product screenshot, faded — just a hint of the UI -->'
          start = source.index(start_marker)
          end = source.index(end_marker)

          result = source[:start] + source[end:]
          result = result.replace('  <rect width="1600" height="400" fill="url(#leftFade)"/>\n', '')

          if title_line not in result:
              raise SystemExit('PlaylistMuse title changed unexpectedly')
          result_image = re.search(r'<image href="(data:image/jpeg;base64,[^"]+)"', result)
          if not result_image or result_image.group(1) != image_data:
              raise SystemExit('Embedded screenshot changed unexpectedly')

          path.write_text(result, encoding='utf-8')
          PY

      - name: Commit approved banner
        run: |
          rm .github/workflows/apply-transparent-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/playlistmuse-hero.svg .github/workflows/apply-transparent-banner.yml
          git commit -m "docs: use transparent hero banner"
          git push origin test
