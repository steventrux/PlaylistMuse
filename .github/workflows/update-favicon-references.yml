name: Update favicon references

on:
  push:
    paths:
      - '.github/workflows/update-favicon-references.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'playlistmuse-favicon.png'
          new = 'playlistmuse-favicon-v2.png'
          for filename in ('backend/main.py', 'tests/test_main.py', 'tests/test_static_assets.py'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected old favicon reference missing in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py tests/test_main.py tests/test_static_assets.py
          git commit -m 'Update favicon references'
          git push
