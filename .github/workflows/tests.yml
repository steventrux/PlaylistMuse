name: Apply repository audit

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: repository-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify and apply reviewed patch
        run: |
          set -euo pipefail
          cat .audit-patch-* > /tmp/repository-audit.patch
          echo "8fbbac21f4561b81119030dd3fbcb5074db64eadec33afdb65b15ca914a9d8ae  /tmp/repository-audit.patch" | sha256sum --check
          git apply --check /tmp/repository-audit.patch
          git apply /tmp/repository-audit.patch
          rm .audit-patch-*
          cat > .github/workflows/tests.yml <<'YAML'
          name: Tests

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - name: Install dependencies
                  run: python -m pip install -r requirements.txt -r requirements-dev.txt
                - name: Check Python source
                  run: |
                    python -m compileall -q backend tests
                    ruff check backend tests
                - name: Run Python tests
                  run: python -m pytest -q
                - name: Check frontend JavaScript syntax
                  run: |
                    for file in frontend/*.js tests/*.cjs; do
                      node --check "$file"
                    done
                - name: Run frontend unit tests
                  run: node --test tests/*.cjs
                - name: Check deployment files
                  run: |
                    bash -n scripts/*.sh
                    cp .env.example .env
                    docker compose -f docker-compose.yml config --quiet
                    docker compose -f docker-compose.playlistmuse.yml config --quiet
          YAML
          sed -i 's/^          //' .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: optimize repository internals"
          git push origin HEAD:${{ github.head_ref }}
