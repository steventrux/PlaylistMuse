name: Apply audited update

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: audit-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed source bundle
        run: |
          set -euo pipefail
          test -f .audit-update.tar.gz.b64
          base64 --decode .audit-update.tar.gz.b64 | tar -xzf -
          rm .audit-update.tar.gz.b64
          rm -f backend/gemini_compat.py tests/test_gemini_compat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: optimize repository internals"
          git push origin HEAD:${{ github.head_ref }}
