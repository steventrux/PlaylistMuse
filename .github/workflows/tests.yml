name: Apply repository audit

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: repository-audit
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-release-group-artwork
          fetch-depth: 0
      - name: Validate and publish reviewed source patch
        run: |
          set -euo pipefail
          cat .audit-patch-* > /tmp/repository-audit.patch
          git apply --check /tmp/repository-audit.patch
          git apply /tmp/repository-audit.patch
          python - <<'PY'
          from pathlib import Path
          import re

          account_path = Path("backend/youtube_account.py")
          account_path.write_text(
              account_path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )

          settings_path = Path("frontend/ai-settings.js")
          source = settings_path.read_text(encoding="utf-8")
          replacement = """  function rememberSettings(data, fallbackProvider = '') {
            loadedProvider = data.provider || fallbackProvider;
            loadedSettings = {
              model: data.model || '',
              fallback_1: data.fallback_1 || '',
              fallback_2: data.fallback_2 || '',
              base_url: data.base_url || '',
            };
            providerKeysSet = data.provider_keys_set || {};
            configuredProviders = {};
            if (data.configured && loadedProvider) configuredProviders[loadedProvider] = true;
          }

          function modelChain(data) {"""
          source, count = re.subn(
              r"  function rememberSettings\(.*?^  function modelChain\(data\) \{",
              replacement,
              source,
              count=1,
              flags=re.DOTALL | re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not normalize rememberSettings")
          settings_path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          python -m compileall -q backend tests
          for file in frontend/*.js tests/*.cjs; do
            node --check "$file"
          done
          bash -n scripts/*.sh
          rm .audit-patch-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: optimize repository internals"
          git push origin HEAD:feature-release-group-artwork
