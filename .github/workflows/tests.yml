name: Regression tests

on:
  push:
    branches:
      - main
      - phase-0-regression-safety
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run regression suite
        run: python -m pytest -q

  musicbrainz-option-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real MusicBrainz option matrix
        env:
          PLAYLISTMUSE_MUSICBRAINZ_CONTACT: https://github.com/steventrux/PlaylistMuse
        run: python scripts/musicbrainz_options_smoke.py

      - name: Upload option matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicbrainz-options-smoke-report
          path: artifacts/musicbrainz-options-smoke-report.json
          if-no-files-found: warn
