name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/playlist-mosaic.js
          node --check frontend/playlist.js
      - name: Run frontend unit tests
        run: node --test tests/test_playlist_mosaic.cjs
      - name: Upload source snapshot for audit
        uses: actions/upload-artifact@v4
        with:
          name: playlistmuse-source-audit
          path: |
            .
            !.git/**
            !.pytest_cache/**
            !**/__pycache__/**
            !data/**
          include-hidden-files: true
          retention-days: 1
