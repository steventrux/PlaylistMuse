name: Implement library pagination v2

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/implement-library-pagination-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply pagination changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          Path('frontend/library-pagination.js').write_text(dedent("""\
          (() => {
            'use strict';

            const DEFAULT_PAGE_SIZE = 10;

            function positiveInteger(value, fallback) {
              const number = Number(value);
              return Number.isInteger(number) && number > 0 ? number : fallback;
            }

            function pageCount(totalItems, pageSize = DEFAULT_PAGE_SIZE) {
              const size = positiveInteger(pageSize, DEFAULT_PAGE_SIZE);
              const total = Math.max(0, Number(totalItems) || 0);
              return Math.ceil(total / size);
            }

            function clampPage(page, totalItems, pageSize = DEFAULT_PAGE_SIZE) {
              const totalPages = pageCount(totalItems, pageSize);
              if (!totalPages) return 1;
              return Math.min(positiveInteger(page, 1), totalPages);
            }

            function paginate(items, page = 1, pageSize = DEFAULT_PAGE_SIZE) {
              const source = Array.isArray(items) ? items : [];
              const size = positiveInteger(pageSize, DEFAULT_PAGE_SIZE);
              const totalPages = pageCount(source.length, size);
              const currentPage = clampPage(page, source.length, size);
              const start = (currentPage - 1) * size;
              return {
                items: source.slice(start, start + size),
                currentPage,
                totalPages,
                totalItems: source.length,
              };
            }

            function pageTokens(currentPage, totalPages) {
              const total = Math.max(0, Number(totalPages) || 0);
              if (total <= 7) return Array.from({length: total}, (_, index) => index + 1);

              const current = Math.min(Math.max(1, positiveInteger(currentPage, 1)), total);
              const pages = new Set([1, total, current - 1, current, current + 1]);
              if (current <= 4) [2, 3, 4, 5].forEach((page) => pages.add(page));
              if (current >= total - 3) {
                [total - 4, total - 3, total - 2, total - 1].forEach((page) => pages.add(page));
              }

              const sorted = [...pages]
                .filter((page) => page >= 1 && page <= total)
                .sort((left, right) => left - right);
              const tokens = [];
              sorted.forEach((page, index) => {
                const previous = sorted[index - 1];
                if (previous && page - previous > 1) tokens.push('ellipsis');
                tokens.push(page);
              });
              return tokens;
            }

            const api = Object.freeze({
              DEFAULT_PAGE_SIZE,
              pageCount,
              clampPage,
              paginate,
              pageTokens,
            });

            if (typeof window !== 'undefined') window.PlaylistMuseLibraryPagination = api;
            if (typeof module !== 'undefined' && module.exports) module.exports = api;
          })();
          """), encoding='utf-8')

          Path('tests/test_library_pagination.cjs').write_text(dedent("""\
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const pagination = require('../frontend/library-pagination.js');

          test('playlist pagination uses ten items per page by default', () => {
            const items = Array.from({length: 27}, (_, index) => index + 1);
            assert.equal(pagination.DEFAULT_PAGE_SIZE, 10);
            assert.equal(pagination.paginate(items, 1).totalPages, 3);
            assert.deepEqual(pagination.paginate(items, 1).items, items.slice(0, 10));
            assert.deepEqual(pagination.paginate(items, 2).items, items.slice(10, 20));
            assert.deepEqual(pagination.paginate(items, 3).items, items.slice(20, 27));
          });

          test('playlist pagination clamps the current page after the result set shrinks', () => {
            const items = Array.from({length: 20}, (_, index) => index + 1);
            const page = pagination.paginate(items, 3);
            assert.equal(page.currentPage, 2);
            assert.equal(page.totalPages, 2);
            assert.deepEqual(page.items, items.slice(10, 20));
          });

          test('playlist pagination produces compact page tokens', () => {
            assert.deepEqual(
              pagination.pageTokens(10, 20),
              [1, 'ellipsis', 9, 10, 11, 'ellipsis', 20],
            );
            assert.deepEqual(
              pagination.pageTokens(1, 20),
              [1, 2, 3, 4, 5, 'ellipsis', 20],
            );
          });
          """), encoding='utf-8')

          library_path = Path('frontend/library.js')
          library = library_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  const tagTools = window.PlaylistMuseLibraryTags;\n  let expandedLibraryId = null;",
                  "  const tagTools = window.PlaylistMuseLibraryTags;\n"
                  "  const paginationTools = window.PlaylistMuseLibraryPagination;\n"
                  "  const PAGE_SIZE = paginationTools.DEFAULT_PAGE_SIZE;\n"
                  "  let expandedLibraryId = null;",
              ),
              (
                  "  let libraryItems = [];\n  let activeStatusFilter = 'all';",
                  "  let libraryItems = [];\n  let activeStatusFilter = 'all';\n  let currentPage = 1;",
              ),
          ]
          for old, new in replacements:
              if old not in library:
                  raise SystemExit(f'library.js marker missing: {old[:40]}')
              library = library.replace(old, new, 1)

          render_start = library.index("  function renderLibrary() {\n")
          render_end = library.index("\n  function setStatusFilter(filter) {", render_start)
          pagination_render = dedent("""\
            function createPageButton(pageNumber) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'library-page-number';
              button.textContent = String(pageNumber);
              button.setAttribute('aria-label', `Go to page ${pageNumber}`);
              const active = pageNumber === currentPage;
              button.classList.toggle('active', active);
              if (active) button.setAttribute('aria-current', 'page');
              button.addEventListener('click', () => setLibraryPage(pageNumber));
              return button;
            }

            function renderPagination(pageState) {
              const pagination = $('library-pagination');
              const numbers = $('library-page-numbers');
              const showPagination = pageState.totalPages > 1;
              pagination.classList.toggle('hidden', !showPagination);
              if (!showPagination) {
                numbers.replaceChildren();
                return;
              }

              $('library-page-previous').disabled = currentPage <= 1;
              $('library-page-next').disabled = currentPage >= pageState.totalPages;
              const controls = paginationTools.pageTokens(currentPage, pageState.totalPages).map((token) => {
                if (token !== 'ellipsis') return createPageButton(token);
                const ellipsis = document.createElement('span');
                ellipsis.className = 'library-page-ellipsis';
                ellipsis.textContent = '…';
                ellipsis.setAttribute('aria-hidden', 'true');
                return ellipsis;
              });
              numbers.replaceChildren(...controls);
            }

            function setLibraryPage(pageNumber) {
              const totalItems = visibleLibraryItems().length;
              const nextPage = paginationTools.clampPage(pageNumber, totalItems, PAGE_SIZE);
              if (nextPage === currentPage) return;
              currentPage = nextPage;
              expandedLibraryId = null;
              renderLibrary();
              $('library-list').scrollIntoView({block: 'start'});
            }

            function resetPageAndRenderLibrary() {
              currentPage = 1;
              expandedLibraryId = null;
              renderLibrary();
            }

            function renderLibrary() {
              const items = visibleLibraryItems();
              const pageState = paginationTools.paginate(items, currentPage, PAGE_SIZE);
              currentPage = pageState.currentPage;
              if (expandedLibraryId && !pageState.items.some((item) => item.id === expandedLibraryId)) {
                expandedLibraryId = null;
              }

              $('library-list').replaceChildren(...pageState.items.map(createLibraryItem));
              updateLibraryCount(items.length);
              renderPagination(pageState);

              const empty = $('library-empty');
              const hasSavedPlaylists = libraryItems.length > 0;
              empty.textContent = hasSavedPlaylists
                ? 'No playlists match the current search and filters.'
                : 'No saved playlists yet. Create one and it will appear here automatically.';
              empty.classList.toggle('hidden', items.length > 0);
            }
          """)
          pagination_render = ''.join(f'  {line}\n' if line else '\n' for line in pagination_render.splitlines())
          library = library[:render_start] + pagination_render.rstrip('\n') + library[render_end:]

          old = "  function setStatusFilter(filter) {\n    activeStatusFilter = filter;"
          new = (
              "  function setStatusFilter(filter) {\n"
              "    activeStatusFilter = filter;\n"
              "    currentPage = 1;\n"
              "    expandedLibraryId = null;"
          )
          if old not in library:
              raise SystemExit('status filter marker missing')
          library = library.replace(old, new, 1)

          old = "  $('library-search').addEventListener('input', renderLibrary);\n  tagTools?.bindFilters(renderLibrary);"
          new = (
              "  $('library-search').addEventListener('input', resetPageAndRenderLibrary);\n"
              "  tagTools?.bindFilters(resetPageAndRenderLibrary);"
          )
          if old not in library:
              raise SystemExit('filter bindings marker missing')
          library = library.replace(old, new, 1)

          old = "  $('library-sort').addEventListener('change', () => {\n    expandedLibraryId = null;\n    void loadLibrary();\n  });"
          new = (
              "  $('library-page-previous').addEventListener('click', () => setLibraryPage(currentPage - 1));\n"
              "  $('library-page-next').addEventListener('click', () => setLibraryPage(currentPage + 1));\n"
              "  $('library-sort').addEventListener('change', () => {\n"
              "    currentPage = 1;\n"
              "    expandedLibraryId = null;\n"
              "    void loadLibrary();\n"
              "  });"
          )
          if old not in library:
              raise SystemExit('sort binding marker missing')
          library_path.write_text(library.replace(old, new, 1), encoding='utf-8')

          html_path = Path('frontend/library.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('/static/library.css?v=8', '/static/library.css?v=9', 1)
          empty = dedent("""\
                <div id="library-empty" class="empty-state hidden">
                  No saved playlists yet. Create one and it will appear here automatically.
                </div>""")
          empty = ''.join(f'      {line}\n' if line else '\n' for line in empty.splitlines()).rstrip('\n')
          nav = dedent("""\
                <nav id="library-pagination" class="library-pagination hidden" aria-label="Playlist pages">
                  <button id="library-page-previous" class="secondary library-page-nav" type="button">Previous</button>
                  <div id="library-page-numbers" class="library-page-numbers"></div>
                  <button id="library-page-next" class="secondary library-page-nav" type="button">Next</button>
                </nav>""")
          nav = ''.join(f'      {line}\n' if line else '\n' for line in nav.splitlines()).rstrip('\n')
          if empty not in html:
              raise SystemExit('library.html empty state marker missing')
          html = html.replace(empty, empty + '\n' + nav, 1)
          old = '  <script src="/static/library.js?v=7"></script>'
          new = '  <script src="/static/library-pagination.js?v=1"></script>\n  <script src="/static/library.js?v=8"></script>'
          if old not in html:
              raise SystemExit('library.html script marker missing')
          html_path.write_text(html.replace(old, new, 1), encoding='utf-8')

          css_path = Path('frontend/library.css')
          css = css_path.read_text(encoding='utf-8')
          pagination_css = dedent("""\

          .library-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
          }

          .library-page-numbers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
          }

          .library-page-nav,
          .library-page-number {
            min-height: 34px;
            font-size: .78rem;
            font-weight: 760;
          }

          .library-page-nav { padding: 0 12px; }

          .library-page-number {
            min-width: 34px;
            padding: 0 8px;
            border: 1px solid rgba(169, 155, 255, .2);
            border-radius: 9px;
            background: #151a33;
            color: #b8bdd2;
          }

          .library-page-number:hover {
            border-color: rgba(183, 156, 255, .38);
            background: #29315b;
            color: #fff;
          }

          .library-page-number.active,
          .library-page-number.active:hover {
            border-color: #8b5cf6;
            background: #8b5cf6;
            color: #fff;
          }

          .library-page-ellipsis {
            min-width: 20px;
            color: var(--text-muted);
            text-align: center;
          }
          """)
          marker = '\n@media (max-width: 760px) {'
          if marker not in css:
              raise SystemExit('library.css responsive marker missing')
          css = css.replace(marker, pagination_css + marker, 1)
          css = css.replace(
              "  .library-filter {\n    flex: 1 1 0;\n  }\n}",
              "  .library-filter {\n    flex: 1 1 0;\n  }\n\n  .library-pagination {\n    flex-wrap: wrap;\n  }\n}",
              1,
          )
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/test_playlist_library.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = "    assert 'id=\"library-list\"' in page\n    assert \"/api/library/playlists\" in library_script"
          new = (
              "    assert 'id=\"library-list\"' in page\n"
              "    assert 'id=\"library-pagination\"' in page\n"
              "    assert '/static/library-pagination.js?v=1' in page\n"
              "    assert \"/api/library/playlists\" in library_script\n"
              "    assert \"const PAGE_SIZE = paginationTools.DEFAULT_PAGE_SIZE;\" in library_script"
          )
          if old not in test_text:
              raise SystemExit('playlist library test marker missing')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')

          for workflow in (
              Path('.github/workflows/implement-library-pagination.yml'),
              Path('.github/workflows/implement-library-pagination-v2.yml'),
          ):
              if workflow.exists(): workflow.unlink()
          PY

      - name: Commit pagination implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/library.js frontend/library.html frontend/library.css frontend/library-pagination.js tests/test_library_pagination.cjs tests/test_playlist_library.py .github/workflows/implement-library-pagination.yml .github/workflows/implement-library-pagination-v2.yml
          git diff --cached --check
          git commit -m "Paginate playlist library"
          git push origin HEAD:dev
