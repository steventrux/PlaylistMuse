name: Finalize development branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-test-to-dev.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy compose and temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm docker-compose.playlistmuse.yml
          git rm .github/workflows/rename-test-to-dev.yml
          git commit -m "chore: remove legacy compose and rename test branch"

      - name: Update main and dev, then remove test
        run: |
          git push origin HEAD:main
          git push --force origin HEAD:dev
          git push origin --delete test
