name: Revert broad recording preference

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-earliest-reliable-recording.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Revert unsupported hypothesis
        run: |
          target="$(git log --format=%H --grep='^Prefer earliest reliable MusicBrainz recording$' -n 1)"
          test -n "$target"
          git revert --no-commit "$target"
          rm .github/workflows/fix-earliest-reliable-recording.yml

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit revert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/metadata_validation.py tests/test_metadata_validation.py .github/workflows/fix-earliest-reliable-recording.yml
          git commit -m "Revert broad MusicBrainz recording preference"
          git push origin HEAD:dev
