name: Apply repository maintenance

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-repository-maintenance.yml
      - .github/scripts/apply_repository_maintenance.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply maintenance changes
        run: python .github/scripts/apply_repository_maintenance.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify optimized code
        run: |
          python -m compileall -q backend tests
          ruff check --select E4,E7,E9,F backend tests
          ruff check --select B,C4,SIM,UP backend
          python -m pytest -q
          node --test tests/*.cjs
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/ci.yml .github/workflows/tests.yml tests/test_metadata_context_isolation.py
          git commit -m "Harden request isolation and consolidate CI"
          git push origin dev
