name: Fix explicit temporal precedence

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-explicit-temporal-precedence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply focused fix
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          module_path = Path("backend/metadata_validation.py")
          text = module_path.read_text(encoding="utf-8")
          function_start = text.index("def constraints_from_payload(")
          block_start = text.index("    release_year = (", function_start)
          block_end = text.index("\n\n    country = base.artist_country", block_start)
          replacement = dedent(
              '''
                  interpreted_release_year = (
                      _clean_year(payload.get("release_year"))
                      if trusted("release_year")
                      else None
                  )
                  interpreted_year_from = (
                      _clean_year(payload.get("release_year_from"))
                      if trusted("release_year_from")
                      else None
                  )
                  interpreted_year_to = (
                      _clean_year(payload.get("release_year_to"))
                      if trusted("release_year_to")
                      else None
                  )

                  if base.release_year is not None:
                      release_year = base.release_year
                      year_from = None
                      year_to = None
                  elif base.release_year_from is not None or base.release_year_to is not None:
                      release_year = None
                      year_from = base.release_year_from
                      year_to = base.release_year_to
                  else:
                      release_year = interpreted_release_year
                      year_from = interpreted_year_from
                      year_to = interpreted_year_to
                      if (
                          year_from is not None
                          and year_to is not None
                          and year_from > year_to
                      ):
                          year_from, year_to = year_to, year_from
              '''
          ).strip("\n")
          module_path.write_text(
              text[:block_start] + replacement + text[block_end:],
              encoding="utf-8",
          )

          test_path = Path("tests/test_metadata_validation.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_explicit_temporal_range_cannot_be_broadened_by_ai"
          if test_name not in tests:
              marker = "\n\ndef test_validates_original_year_collaboration_and_album_edition():\n"
              regression = dedent(
                  '''

                  def test_explicit_temporal_range_cannot_be_broadened_by_ai():
                      prompt = (
                          "Crea una playlist rock di brani degli anni ’80 oppure degli anni ’90, "
                          "ma solo pubblicati dopo il 1985."
                      )
                      fallback = extract_metadata_constraints(prompt)
                      constraints = constraints_from_payload(
                          {
                              "release_year_from": 1980,
                              "release_year_to": 1999,
                              "field_confidence": {
                                  "release_year_from": 0.99,
                                  "release_year_to": 0.99,
                              },
                          },
                          fallback=fallback,
                      )

                      assert (fallback.release_year_from, fallback.release_year_to) == (
                          1986,
                          1999,
                      )
                      assert (constraints.release_year_from, constraints.release_year_to) == (
                          1986,
                          1999,
                      )

                      result = validate_metadata(
                          TrackMetadata(
                              artist="Survivor",
                              title="Eye of the Tiger",
                              original_release_year=1982,
                              matched_artist="Survivor",
                              match_score=0.98,
                              confidence="high",
                          ),
                          constraints,
                      )
                      assert result.status == "invalid"
                      assert "release year 1982 is before 1986" in result.violations
                  '''
              ).rstrip()
              if tests.count(marker) != 1:
                  raise SystemExit("Could not locate test insertion point")
              test_path.write_text(
                  tests.replace(marker, regression + marker, 1),
                  encoding="utf-8",
              )

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/metadata_validation.py tests/test_metadata_validation.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve explicit temporal constraints over AI interpretation"
          git push origin HEAD:dev
