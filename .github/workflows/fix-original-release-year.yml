name: Fix original release year

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-original-release-year.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply focused fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}: {old[:100]!r}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/metadata_validation.py",
              'MIN_CONSTRAINT_CONFIDENCE = 0.85\n',
              'MIN_CONSTRAINT_CONFIDENCE = 0.85\nMETADATA_CACHE_VERSION = "2"\n',
          )
          replace_once(
              "backend/metadata_validation.py",
              'def _cache_key(artist: str, title: str) -> str:\n'
              '    return f"{_normalize(artist)}|{_normalize(title)}"\n',
              'def _cache_key(artist: str, title: str) -> str:\n'
              '    """Version cache entries when metadata interpretation semantics change."""\n'
              '    return (\n'
              '        f"{METADATA_CACHE_VERSION}|{_normalize(artist)}|"\n'
              '        f"{_normalize(title)}"\n'
              '    )\n',
          )
          replace_once(
              "backend/metadata_validation.py",
              'def _metadata_from_recording(\n',
              'def _release_original_date(release: dict[str, Any]) -> str | None:\n'
              '    """Prefer the release-group origin over a later reissue date."""\n'
              '    release_group = (\n'
              '        release.get("release-group")\n'
              '        if isinstance(release.get("release-group"), dict)\n'
              '        else {}\n'
              '    )\n'
              '    candidates = [\n'
              '        str(value).strip()\n'
              '        for value in (\n'
              '            release_group.get("first-release-date"),\n'
              '            release.get("date"),\n'
              '        )\n'
              '        if str(value or "").strip()\n'
              '    ]\n'
              '    return min(candidates, key=_date_key) if candidates else None\n'
              '\n'
              '\n'
              'def _metadata_from_recording(\n',
          )
          replace_once(
              "backend/metadata_validation.py",
              '    dated = [release for release in releases if str(release.get("date", "")).strip()]\n'
              '    earliest = (\n'
              '        min(dated, key=lambda item: _date_key(str(item.get("date"))))\n'
              '        if dated\n'
              '        else {}\n'
              '    )\n',
              '    dated = [release for release in releases if _release_original_date(release)]\n'
              '    earliest = (\n'
              '        min(\n'
              '            dated,\n'
              '            key=lambda item: _date_key(_release_original_date(item)),\n'
              '        )\n'
              '        if dated\n'
              '        else {}\n'
              '    )\n',
          )
          replace_once(
              "backend/metadata_validation.py",
              '    release_date = str(earliest.get("date", "")).strip() or None\n',
              '    release_date = _release_original_date(earliest) if earliest else None\n',
          )
          replace_once(
              "backend/metadata_validation.py",
              '    )\n\nasync def lookup_track_metadata(\n',
              '    )\n\n\nasync def lookup_track_metadata(\n',
          )

          test_path = Path("tests/test_metadata_validation.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '    _album_matches,\n',
              '    _album_matches,\n    _metadata_from_recording,\n',
              1,
          )
          regression = '''\n\ndef test_release_group_date_prevents_reissue_year_drift():\n    metadata = _metadata_from_recording(\n        {\n            "id": "crazy-train-recording",\n            "title": "Crazy Train",\n            "score": 100,\n            "artist-credit": [\n                {\n                    "name": "Ozzy Osbourne",\n                    "artist": {"name": "Ozzy Osbourne", "country": "GB"},\n                }\n            ],\n            "releases": [\n                {\n                    "title": "Blizzard of Ozz (40th Anniversary Expanded Edition)",\n                    "date": "2021-09-17",\n                    "release-group": {\n                        "id": "blizzard-of-ozz",\n                        "title": "Blizzard of Ozz",\n                        "first-release-date": "1980-09-20",\n                    },\n                }\n            ],\n        },\n        "Ozzy Osbourne",\n        "Crazy Train",\n    )\n\n    assert metadata.original_release_date == "1980-09-20"\n    assert metadata.original_release_year == 1980\n\n    result = validate_metadata(\n        metadata,\n        MetadataConstraints(release_year_from=1986, release_year_to=1999),\n    )\n    assert result.status == "invalid"\n    assert "release year 1980 is before 1986" in result.violations\n'''
          marker = '\n\ndef test_sqlite_cache_round_trip(tmp_path: Path):\n'
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate metadata cache test insertion point")
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/metadata_validation.py tests/test_metadata_validation.py
          git diff --cached --quiet && exit 0
          git commit -m "Use original release-group dates for metadata validation"
          git push origin HEAD:dev
