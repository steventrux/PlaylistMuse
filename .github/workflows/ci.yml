name: CI

on:
  push:
    branches:
      - main
      - beta
      - dev
  pull_request:
    branches:
      - main
      - beta
      - dev

permissions:
  contents: read

concurrency:
  group: playlistmuse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F backend tests

      - name: Run Python tests
        run: python -m pytest -q

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find frontend -maxdepth 1 -name "*.js" -print0 | xargs -0 -n1 node --check
          find tests -maxdepth 1 -name "*.cjs" -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript tests
        run: node --test tests/*.cjs

  container:
    name: Container
    runs-on: ubuntu-latest
    needs:
      - python
      - javascript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag playlistmuse:ci .

      - name: Start container
        run: docker run --detach --name playlistmuse-ci --publish 5780:5780 playlistmuse:ci

      - name: Verify application health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5780/api/health > health.json; then
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload["status"] == "healthy"
          print(payload)
          PY
              exit 0
            fi
            sleep 2
          done

          docker logs playlistmuse-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs playlistmuse-ci

      - name: Stop container
        if: always()
        run: docker rm --force playlistmuse-ci || true

  publish-beta:
    name: Publish beta
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    needs:
      - container
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/steventrux/playlistmuse:beta
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=beta
          cache-from: type=gha,scope=playlistmuse-beta
          cache-to: type=gha,mode=max,scope=playlistmuse-beta

      - name: Update rolling beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          cat > release-notes.md <<'EOF'
          ## PlaylistMuse Beta

          This rolling beta release contains the latest testable version of PlaylistMuse.

          ### What's new

          - unified appearance for AI, YouTube Music and Last.fm settings dialogs;
          - consistent full-width connection and configuration status panels;
          - clearer active AI provider presentation;
          - simplified YouTube Music OAuth configuration;
          - aligned Last.fm API settings and status presentation;
          - additional regression tests for the settings interface.

          ### Docker

          ```bash
          docker pull ghcr.io/steventrux/playlistmuse:beta
          ```

          This is a preview release and may still change before promotion to the stable `latest` channel.
          EOF

          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/beta" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null

            gh release edit beta \
              --repo "$GITHUB_REPOSITORY" \
              --title "PlaylistMuse Beta" \
              --prerelease \
              --notes-file release-notes.md
          else
            gh release create beta \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PlaylistMuse Beta" \
              --prerelease \
              --notes-file release-notes.md
          fi

      - name: Verify beta publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          TAG_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/beta" \
              --jq '.object.sha'
          )"

          test "$TAG_SHA" = "$GITHUB_SHA"

          gh release view beta \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url

          docker buildx imagetools inspect \
            ghcr.io/steventrux/playlistmuse:beta
