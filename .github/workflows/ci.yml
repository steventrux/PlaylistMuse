name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "release/**"
  pull_request:
    branches:
      - main
      - dev
      - "release/**"

permissions:
  contents: read

concurrency:
  group: playlistmuse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: |
          ruff check --select E4,E7,E9,F backend tests
          ruff check --select B,C4,SIM,UP backend

      - name: Run prompt quality regressions
        run: |
          python -m pytest -q \
            tests/test_prompt_quality_memory.py \
            tests/test_prompt_regression_flows.py \
            tests/test_playlist_studio.py

      - name: Run Python tests
        run: python -m pytest -q

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find frontend -maxdepth 1 -name "*.js" -print0 | xargs -0 -n1 node --check
          find tests -maxdepth 1 -name "*.cjs" -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript tests
        run: node --test tests/*.cjs

  container:
    name: Container
    runs-on: ubuntu-latest
    needs:
      - python
      - javascript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          bash -n scripts/*.sh
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg PLAYLISTMUSE_VERSION=dev \
            --build-arg PLAYLISTMUSE_CHANNEL=dev \
            --build-arg PLAYLISTMUSE_GIT_SHA=${GITHUB_SHA} \
            --tag playlistmuse:ci .

      - name: Start container
        run: docker run --detach --name playlistmuse-ci --publish 5780:5780 playlistmuse:ci

      - name: Verify application health and build metadata
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5780/api/health > health.json; then
              curl --fail --silent http://127.0.0.1:5780/api/version > version.json
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path("health.json").read_text(encoding="utf-8"))
          version = json.loads(Path("version.json").read_text(encoding="utf-8"))
          assert health["status"] == "healthy"
          assert version["channel"] == "dev"
          assert version["commit"] == os.environ["GITHUB_SHA"][:7]
          assert version["repository_url"] == "https://github.com/steventrux/PlaylistMuse"
          print(health)
          print(version)
          PY
              exit 0
            fi
            sleep 2
          done

          docker logs playlistmuse-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs playlistmuse-ci

      - name: Stop container
        if: always()
        run: docker rm --force playlistmuse-ci || true
