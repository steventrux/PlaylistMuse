name: Install approved banner

on:
  push:
    branches:
      - test
    paths:
      - ".github/banner-upload/ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Rebuild approved banner
        shell: bash
        run: |
          cat .github/banner-upload/c*.b64 | base64 --decode | gzip --decompress > .github/assets/playlistmuse-hero.svg
          python -c 'from pathlib import Path; import hashlib; p=Path(".github/assets/playlistmuse-hero.svg"); assert p.stat().st_size == 83440, p.stat().st_size; assert hashlib.sha256(p.read_bytes()).hexdigest() == "de4c202fd8fa544d8737565bd487707df773f025fa4f1d9c761ab602e18c1e61"'

          rm -rf .github/banner-upload
          rm -f .github/workflows/install-approved-banner.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: install approved hero banner"
          git push origin HEAD:test
