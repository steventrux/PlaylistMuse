name: Install exact header banner

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/install-exact-header-banner.yml

permissions:
  contents: write

jobs:
  install-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Generate the exact uploaded banner
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source_path = Path('.github/assets/playlistmuse-logo-lockup.svg')
          output_path = Path('frontend/playlistmuse-banner.svg')
          source = source_path.read_text(encoding='utf-8')

          expected_source_hash = '73b30ccc68382a0da123cdac474f931b91f89f25a564b373977a310ca037bd0f'
          actual_source_hash = sha256(source.encode('utf-8')).hexdigest()
          if actual_source_hash != expected_source_hash:
              raise SystemExit(f'Unexpected source banner hash: {actual_source_hash}')

          banner = source.replace(
              '<svg viewBox="0 0 1129 346" width="1129" height="346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PlaylistMuse — Built for people who would rather describe a sound than manually assemble a queue">',
              '<svg viewBox="0 0 997 230" width="997" height="230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PlaylistMuse">',
          )
          banner = banner.replace(
              'x="60.0" y="55.0" width="187.3" height="236.0"',
              'x="10.0" y="10.0" width="166.7" height="210.0"',
          )
          banner = banner.replace(
              'x="287.3" y="65.5" width="782.0" height="141.0"',
              'x="204.7" y="44.5" width="782.0" height="141.0"',
          )
          banner = '\n'.join(
              line for line in banner.splitlines() if '<text ' not in line
          ) + '\n'

          expected_banner_hash = 'f5cae7189adfdf9e1b40a4dd68a7c2e1c3fe6c723270b599fbeccc1795740b5e'
          actual_banner_hash = sha256(banner.encode('utf-8')).hexdigest()
          if actual_banner_hash != expected_banner_hash:
              raise SystemExit(f'Generated banner hash mismatch: {actual_banner_hash}')

          output_path.write_text(banner, encoding='utf-8')
          print(f'Generated {output_path} with SHA-256 {actual_banner_hash}')
          PY

      - name: Commit exact banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/playlistmuse-banner.svg
          if git diff --cached --quiet; then
            echo "Banner already present"
            exit 0
          fi
          git commit -m "Add exact PlaylistMuse header banner"
          git push origin HEAD:dev
